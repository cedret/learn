<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactez-nous</title>
    <link rel="stylesheet" href="style.css"> <!-- Si vous avez un fichier CSS -->
</head>
<body>
    <header>
        <h1>Contactez-nous</h1>
    </header>
    
    <div class="content">
        <h2>Envoyez-nous un message :</h2>
        <form action="mailto:contact@monsite.com" method="post" enctype="text/plain">
            <label for="name">Nom :</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="message">Message :</label><br>
            <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>

            <input type="submit" value="Envoyer">
            <input type="reset" value="Effacer">
        </form>
        <p>Ou contactez-nous directement par email : <a href="mailto:contact@monsite.com">contact@monsite.com</a></p>
    </div>

    <footer>
        <p>&copy; 2025 Mon Site Web</p>
    </footer>
</body>
</html>
